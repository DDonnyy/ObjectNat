[project]
name = "ObjectNat"
dynamic = ["version"]
description = "ObjectNat is an open-source library created for geospatial analysis created by IDU team"
readme = "README.rst"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "DDonnyy", email = "63115678+DDonnyy@users.noreply.github.com" },
]
dependencies = [
    "geopandas>=1.1.0,<2.0.0",
    "iduedu>=2.0.0,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "numpy>=2.4.0,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "scipy>=1.17.0,<2.0.0",
    "tqdm>=4.66.2,<5.0.0",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "notebooks" },
    { include-group = "release" },
    { include-group = "test" },
    { include-group = "viz" },
    "pre-commit>=4.2.0,<5.0.0",
    "pyarrow>=19.0.1,<20.0.0",
]
docs = [
    "furo>=2025.9.25,<2026.0.0",
    "linkify-it-py>=2.0.3,<3.0.0",
    "myst-nb>=1.1.0,<2.0.0",
    "myst-parser>=4.0.1,<5.0.0",
    "sphinx>=8.0.0,<9.0.0",
    "sphinx-autodoc-typehints>=3.2.0,<4.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-design>=0.6.0,<0.7.0",
]
lint = [
    "black>=25.9.0,<26.0.0",
    "isort>=6.1.0,<7.0.0",
    "pylint>=3.3.5,<4.0.0",
]
notebooks = [
    "jupyter>=1.1.1,<2.0.0",
]
release = [
    "python-semantic-release>=9.15.0,<10.0.0",
]
test = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]
viz = [
    "folium>=0.19.5,<0.20.0",
    "mapclassify>=2.8.1,<3.0.0",
    "matplotlib>=3.10.1,<4.0.0",
]


[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

# Single source of truth for the version: objectnat/_version.py (VERSION = "x.y.z").
# python-semantic-release bumps that file; hatchling reads it at build time.
[tool.hatch.version]
path = "objectnat/_version.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["objectnat"]

[tool.hatch.build.targets.sdist]
include = [
    "/objectnat",
    "/LICENSE.txt",
    "/README.rst",
    "/pyproject.toml",
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pylint.format]
max-line-length = 120
expected-line-ending-format = "LF"
max-locals = 20
disable = [
    "duplicate-code",
    "fixme",
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "cyclic-import",
    "line-too-long",
    "too-many-return-statements",
    "too-many-positional-arguments",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
skip = ["__init__.py"]

[tool.coverage.run]
branch = true
source = ["objectnat"]

[tool.coverage.report]
# Floor set below the ~85% baseline (2026-07-10) so runs stay green despite
# accessibility coverage drifting with live Overpass graph data.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "pragma: no branch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Automated releases (python-semantic-release)
#
# The next version is derived from Conventional Commit messages since the last
# tag: feat -> minor, fix/perf -> patch, feat!/BREAKING CHANGE -> major.
# The release workflow runs after CI succeeds on master, bumps
# objectnat/_version.py, updates CHANGELOG.md, commits, tags vX.Y.Z, and
# publishes. See CONTRIBUTING.md.
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_variables = ["objectnat/_version.py:VERSION"]
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]\n\nAutomated release, see CHANGELOG.md."
build_command = "python -m pip install uv && uv build"
allow_zero_version = false
major_on_zero = true

[tool.semantic_release.branches.master]
match = "master"

[tool.semantic_release.commit_parser_options]
# Conventional-commit types that trigger a version bump. Everything else
# (docs, test, chore, refactor, ci, style, build) leaves the version untouched.
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "refactor",
    "style",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ['''^chore\(release\):.*''']
