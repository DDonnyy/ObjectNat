name: Tests and Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write # push generated test images to the assets branch
  id-token: write # OIDC for Codecov

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: make install-dev

      - name: Check formatting
        run: make format-check

      - name: Run tests with coverage
        run: make coverage-xml

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      # ObjectNat-specific: the test suite renders result plots into
      # tests/test_output/. Publish them to the orphan `assets` branch so the
      # README and docs can hotlink always-current example images.
      - name: Commit and push test images to assets branch
        if: >
          github.repository == 'IDUclub/ObjectNat' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          if git ls-remote --exit-code --heads origin assets; then
            git fetch origin assets
            git checkout assets
          else
            git checkout --orphan assets
            git reset --hard
          fi
          rm -f ./*.png || echo "No old PNGs to remove"
          git rm -f ./*.png || echo "No old PNGs to remove from Git"
          cp -r tests/test_output/*.png . || echo "No images to copy"
          git add ./*.png
          git commit -m "Update test images" || echo "No changes to commit"
          git push --force origin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
